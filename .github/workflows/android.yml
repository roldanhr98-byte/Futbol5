name: Android APK

# APK de PRUEBA (arm64, sin Gradle, sin permisos) con las 133 animaciones del pack integradas (assets/animations/pack_clips.res
# y pack_keeper.res, ya convertidas dentro del juego). Firmada con un keystore de DEPURACION estandar de Android
# (alias androiddebugkey, contrasena android) creado en cada ejecucion: no hay secretos ni clave permanente.
# Consecuencia: cada APK tiene una firma distinta, asi que hay que desinstalar la anterior antes de instalar la nueva.
# Se publica como artefacto del workflow y, si se pide al lanzarlo a mano (publish_release), tambien como pre-release de
# PRUEBA con el APK adjunto para que cualquiera lo descargue sin cuenta (no es una release de produccion).

on:
  push:
    branches: [main, master, ccr-f4fb4f85-olnklr, ccr-a6c53cd2-uoxpk0]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
    inputs:
      allow_without_pack:
        description: "Permitir compilar SIN las animaciones del pack (cae a Tripo; no es la APK completa)"
        type: boolean
        default: false
      skip_tests:
        description: "Saltar las pruebas headless (solo para compilar rapido)"
        type: boolean
        default: false
      publish_release:
        description: "Publicar el APK como pre-release de prueba (descarga publica, no gasta la cuota de artefactos)"
        type: boolean
        default: false

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # solo para publicar la pre-release de prueba (publish_release)

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BASE_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
  ANDROID_CMDLINE_TOOLS: "commandlinetools-linux-11076708_latest.zip"
  ANDROID_BUILD_TOOLS: "35.0.1"
  ANDROID_PLATFORM: "android-35"

jobs:
  apk:
    runs-on: ubuntu-24.04
    # La suite incluye partidos completos de 3, 5, 7 y 10 minutos de juego simulado.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Animaciones del pack y licencia
        env:
          ALLOW_NO_PACK: ${{ inputs.allow_without_pack }}
        run: |
          if [ -f assets/animations/pack_clips.res ]; then
            [ -f assets/animations/pack_keeper.res ] || { echo "::error::Falta assets/animations/pack_keeper.res (animaciones del arquero)."; exit 1; }
            echo "PACK_INCLUDED=true" >> "$GITHUB_ENV"
          elif [ "$ALLOW_NO_PACK" = "true" ]; then
            echo "PACK_INCLUDED=false" >> "$GITHUB_ENV"
            echo "::warning::Compilacion SIN el pack: el juego usara los clips de Tripo y la patada procedural."
          else
            echo "::error::Falta assets/animations/pack_clips.res. Generarla con tools/animation_pack/build_pack_library.tscn a partir del pack de Mixamo (ver docs/technical-index/SYSTEMS/ANIMATION_PACK.md) y versionarla en el repositorio, o lanzar a mano con allow_without_pack."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Godot y plantilla Android (con cache)
        id: godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-stable-android

      - name: Descargar Godot y plantilla Android
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dl ~/godot-bin && cd ~/godot-dl
          for f in SHA512-SUMS.txt "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"; do
            curl -fsSL --retry 5 --retry-delay 5 -o "$f" "$GODOT_BASE_URL/$f"
          done
          # Solo los dos ficheros exactos (el fichero de sumas incluye tambien las variantes mono).
          grep -E " Godot_v${GODOT_VERSION}-stable_(linux\.x86_64\.zip|export_templates\.tpz)\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q -o "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -d ~/godot-bin
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T" tpl
          unzip -q -o "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" templates/android_release.apk templates/version.txt -d tpl
          mv tpl/templates/* "$T"/
          cd ~ && rm -rf ~/godot-dl

      - name: Instalar Godot
        run: |
          sudo ln -sf ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
          ls -la ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Android SDK (plataforma, build-tools, platform-tools)
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK" && cd "$SDK"
          curl -fsSL --retry 5 -o cmdtools.zip "https://dl.google.com/android/repository/${ANDROID_CMDLINE_TOOLS}"
          unzip -q -o cmdtools.zip && mkdir -p cmdline-tools/latest
          cp -r cmdline-tools/bin cmdline-tools/lib cmdline-tools/NOTICE.txt cmdline-tools/source.properties cmdline-tools/latest/
          yes | cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;${ANDROID_PLATFORM}" > /dev/null
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${SDK}"
          TRES
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.7.tres

      - name: Importar el proyecto
        run: godot --headless --path . --import

      - name: Pruebas headless
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
        run: tools/run_tests.sh

      # Pruebas que necesitan el esqueleto animado (toques de conduccion con el pie real, pie en la pelota al patear):
      # con render en un servidor X virtual.
      - name: Pruebas con render (pies animados)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
        # Depende del OpenGL por software del runner: si el entorno no puede renderizar, no bloquea el APK (queda en el log).
        continue-on-error: true
        run: |
          sudo apt-get update -q > /dev/null && sudo apt-get install -y -q xvfb libgl1-mesa-dri > /dev/null
          for f in live_feet pack_motion; do
            xvfb-run -a godot --rendering-driver opengl3 --fixed-fps 60 --path . res://tests/run_tests.tscn -- --filter "$f" 2>&1 \
              | sed 's/\x1b\[[0-9;]*m//g' | tee "$RUNNER_TEMP/render_$f.txt"
            if grep -q "SCRIPT ERROR\|\[FAIL\]" "$RUNNER_TEMP/render_$f.txt"; then exit 1; fi
          done

      - name: Version
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.1.${{ github.run_number }}" >> "$GITHUB_ENV"
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"0.1.${{ github.run_number }}\"/" export_presets.cfg

      - name: Keystore de depuracion estandar
        run: |
          KS="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 9125 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Exportar APK firmada
        run: |
          mkdir -p build
          godot --headless --path . --export-release Android build/futbol5.apk
          test -s build/futbol5.apk

      - name: Verificar firma, certificado y contenido
        run: |
          BT="$HOME/android-sdk/build-tools/${ANDROID_BUILD_TOOLS}"
          APK=build/futbol5.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/verify.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/verify.txt"
          grep -q "Number of signers: 1" "$RUNNER_TEMP/verify.txt"
          FPR=$(grep -m1 "certificate SHA-256 digest" "$RUNNER_TEMP/verify.txt" | awk '{print $NF}')
          echo "CERT_SHA256=$FPR" >> "$GITHUB_ENV"
          BADGING=$("$BT/aapt2" dump badging "$APK" 2>/dev/null)
          echo "$BADGING" | grep -E "^package:|native-code"
          echo "$BADGING" | grep -q "package: name='com.webmaletin.futbol5' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"
          echo "$BADGING" | grep -q "native-code: 'arm64-v8a'"
          if echo "$BADGING" | grep -q "uses-permission"; then echo "::error::la APK declara permisos"; exit 1; fi

          # Contenido: las dos librerias del pack (campo y arquero) y los clips integrados estan dentro; los FBX fuente no.
          if [ "$PACK_INCLUDED" = true ]; then
            unzip -l "$APK" | grep -q "animations/pack_clips.res" || { echo "::error::pack_clips.res no esta en la APK"; exit 1; }
            unzip -p "$APK" "assets/assets/animations/pack_clips.res" > "$RUNNER_TEMP/pack_in_apk.res"
            missing=""
            for c in offensive_idle Walking_7_inplace jog_forward_inplace Sprint_inplace Soccer_Pass Soccer_Pass_mirror strike_foward_jog_inplace strike_foward_jog_inplace_mirror Receive Fist_Pump_3 Cheering_2 Fist_Pump Standing_Fist_Pump Defeat_Idle_2 Sad_Idle_3 Disappointed; do
              grep -a -q -F -- "$c" "$RUNNER_TEMP/pack_in_apk.res" || missing="$missing $c"
            done
            [ -z "$missing" ] || { echo "::error::Faltan clips en la APK:$missing"; exit 1; }
            cmp -s "$RUNNER_TEMP/pack_in_apk.res" assets/animations/pack_clips.res || { echo "::error::la libreria de la APK difiere de la del repositorio"; exit 1; }
            unzip -l "$APK" | grep -q "animations/pack_keeper.res" || { echo "::error::pack_keeper.res no esta en la APK"; exit 1; }
            unzip -p "$APK" "assets/assets/animations/pack_keeper.res" | cmp -s - assets/animations/pack_keeper.res || { echo "::error::la libreria del arquero de la APK difiere de la del repositorio"; exit 1; }
          fi
          unzip -l "$APK" | grep -q "animations/footballer_clips.res" || { echo "::error::faltan los clips de Tripo (respaldo)"; exit 1; }
          if unzip -l "$APK" | grep -E -q "\.fbx"; then echo "::error::la APK contiene FBX fuente"; exit 1; fi

          NAME="futbol5-v${VERSION_NAME}.apk"
          cp "$APK" "build/$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c %s "build/$NAME")" >> "$GITHUB_ENV"
          {
            echo "### Futbol 5 APK ${VERSION_NAME} (versionCode ${VERSION_CODE})"
            echo "- Tamano: $(du -h "build/$NAME" | cut -f1) · arm64-v8a · sin permisos"
            echo "- Firma de DEPURACION verificada (v2), SHA-256 del certificado: \`${FPR}\` (clave de depuracion de esta ejecucion)"
            echo "- Animaciones: $( [ "$PACK_INCLUDED" = true ] && echo 'pack de Mixamo (133 clips de campo y arquero, librerias verificadas dentro de la APK) + respaldo Tripo' || echo 'SIN el pack: Tripo + patada procedural')"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar pre-release de prueba
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-prueba-${{ github.run_number }}"
          gh release create "$TAG" "build/$APK_NAME" --prerelease --target "$GITHUB_SHA" \
            --title "Futbol 5 - APK de prueba ${VERSION_NAME}" \
            --notes "APK de PRUEBA (arm64, firma de depuracion, sin permisos). Commit ${GITHUB_SHA::7}. Desinstala la version anterior antes de instalar esta."
          echo "- Descarga publica: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Subir artefacto
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: futbol5-apk
          path: build/${{ env.APK_NAME }}
          retention-days: 14
          if-no-files-found: error
